[project]
name = "episodic-data-engine"
version = "0.1.0"
description = "End-to-end data engine for multimodal robot manipulation datasets"
readme = "README.md"
license = "MIT"
authors = [{ name = "Kushagra Srivastava" }]
requires-python = ">=3.10"
dependencies = [
    "pyarrow>=15",
    "pandas>=2",
    "numpy>=1.24",
    "pydantic>=2",
    "duckdb>=0.10",
    "av>=12",
    "typer>=0.9",
    "rich>=13",
    "huggingface_hub>=0.24",
]

[project.urls]
Repository = "https://github.com/kushagrathisside/Episodic-Data-Engine-For-Cross-Embodiment-Data-Pipelines"

[project.optional-dependencies]
# Heavy model dependencies are optional on purpose: the data engine and its
# tests must run without a multi-GB torch install.
vla = ["torch>=2.2", "lerobot[smolvla]"]
images = ["pillow>=10"]
dev = ["pytest>=8", "pytest-cov>=5"]

[project.scripts]
rde = "rde.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rde"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
