<svg xmlns="http://www.w3.org/2000/svg" width="960" height="392" viewBox="0 0 960 392" role="img" aria-label="State machine for episode quality status. Episodes are ingested as UNKNOWN; the QC gate classifies each as WARNING, PASSED, QUARANTINED or REJECTED. The feedback loop moves passed or warning episodes whose model failures are concentrated to QUARANTINED. Manual review can move a quarantined episode to PASSED or REJECTED. The keep_quality setting selects which statuses enter the clean version; unselected episodes remain on disk.">
  <style>
    svg{
      --panel:#FFFFFF; --panel-2:#EEF2F4; --rule:#DCE3E7; --rule-2:#C7D2D8;
      --ink:#101C24; --accent:#0E6E8B; --accent-soft:#E2EFF4; --accent-line:#8FC2D4;
      --signal:#B45309; --signal-soft:#FBEEDF;
      --ok:#17694A; --ok-soft:#E1F0E9; --warn:#8A6100; --warn-soft:#F8EFD9;
      --err:#A32B23; --err-soft:#F8E6E4;
      --sans:"IBM Plex Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
      --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
      color:var(--ink);
    }
    @media (prefers-color-scheme:dark){
      svg{
        --panel:#121C22; --panel-2:#18242B; --rule:#22313A; --rule-2:#2E414C;
        --ink:#E3EBEF; --accent:#4FBEDC; --accent-soft:#122B34; --accent-line:#2C6D82;
        --signal:#E0913F; --signal-soft:#2E2213;
        --ok:#4FB98A; --ok-soft:#10281F; --warn:#D9A93C; --warn-soft:#2A2312;
        --err:#E5726A; --err-soft:#2E1917;
      }
    }
    .s-box{fill:var(--panel-2);stroke:var(--rule-2);stroke-width:1.5}
    .s-proc{fill:var(--accent-soft);stroke:var(--accent-line);stroke-width:1.5}
    .s-store{fill:var(--panel-2);stroke:var(--rule-2);stroke-width:1.5}
    .s-ext{fill:none;stroke:currentColor;stroke-width:1.5;stroke-dasharray:5 3;opacity:.7}
    .s-hot{fill:var(--signal-soft);stroke:var(--signal);stroke-width:1.75}
    .s-line{stroke:currentColor;stroke-width:1.4;fill:none;opacity:.75}
    .s-line-hot{stroke:var(--signal);stroke-width:2;fill:none}
    .s-line-soft{stroke:currentColor;stroke-width:1.2;fill:none;opacity:.4;stroke-dasharray:4 3}
    text{paint-order:stroke fill;stroke:var(--panel);stroke-width:3.5px;
         stroke-linejoin:round;stroke-linecap:round}
    .t-lbl{font-family:var(--sans);font-size:13.5px;font-weight:500;fill:currentColor}
    .t-sm{font-family:var(--mono);font-size:11.5px;fill:currentColor;opacity:.78}
    .t-tag{font-family:var(--mono);font-size:10.5px;fill:var(--accent);font-weight:600;letter-spacing:.06em}
    .t-hot{font-family:var(--mono);font-size:11.5px;fill:var(--signal);font-weight:500}
    .t-num{font-family:var(--mono);font-size:11.5px;font-weight:700;fill:var(--accent)}
    text{white-space:pre}
  </style>
  <rect width="960" height="392" fill="var(--panel)"/>
  <defs><marker id="ar11" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="currentColor"/></marker><marker id="ar11h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="var(--signal)"/></marker></defs>
  <circle cx="34" cy="174" r="8" fill="currentColor"/>
  <path class="s-line" d="M44,174 L96,174" marker-end="url(#ar11)"/>
  <text class="t-sm" x="46" y="164">ingest</text>
  <rect class="s-box" x="100" y="148" width="140" height="52" rx="6"/>
  <text class="t-lbl" x="170" y="172" text-anchor="middle">UNKNOWN</text>
  <text class="t-sm" x="170" y="190" text-anchor="middle">not yet assessed</text>
  <path class="s-line" d="M244,174 L268,174" marker-end="url(#ar11)"/>
  <path class="s-proc" d="M272,174 L324,136 L376,174 L324,212 Z"/>
  <text class="t-sm" x="324" y="171" text-anchor="middle">QCGate</text>
  <text class="t-sm" x="324" y="186" text-anchor="middle">classify</text>
  <path class="s-line" d="M376,174 L404,174 M404,54 L404,294"/>
  <path class="s-line" d="M404,54 L596,54" marker-end="url(#ar11)"/>
  <text class="t-sm" x="416" y="47">1 ≤ warnings ≤ max</text>
  <path class="s-line" d="M404,134 L596,134" marker-end="url(#ar11)"/>
  <text class="t-sm" x="416" y="127">no gating findings</text>
  <path class="s-line" d="M404,214 L596,214" marker-end="url(#ar11)"/>
  <text class="t-sm" x="416" y="207">warnings &gt; max</text>
  <path class="s-line" d="M404,294 L596,294" marker-end="url(#ar11)"/>
  <text class="t-sm" x="416" y="287">ERROR / CRITICAL failure</text>
  <rect x="600" y="30" width="180" height="48" rx="6" fill="var(--warn-soft)" stroke="var(--warn)" stroke-width="1.75"/>
  <text class="t-lbl" x="690" y="51" text-anchor="middle">WARNING</text>
  <text class="t-sm" x="690" y="68" text-anchor="middle">non-blocking findings</text>
  <rect x="600" y="110" width="180" height="48" rx="6" fill="var(--ok-soft)" stroke="var(--ok)" stroke-width="1.75"/>
  <text class="t-lbl" x="690" y="131" text-anchor="middle">PASSED</text>
  <text class="t-sm" x="690" y="148" text-anchor="middle">no gating findings</text>
  <rect x="600" y="190" width="180" height="48" rx="6" fill="var(--signal-soft)" stroke="var(--signal)" stroke-width="1.75"/>
  <text class="t-lbl" x="690" y="211" text-anchor="middle">QUARANTINED</text>
  <text class="t-sm" x="690" y="228" text-anchor="middle">held for review</text>
  <rect x="600" y="270" width="180" height="48" rx="6" fill="var(--err-soft)" stroke="var(--err)" stroke-width="1.75"/>
  <text class="t-lbl" x="690" y="291" text-anchor="middle">REJECTED</text>
  <text class="t-sm" x="690" y="308" text-anchor="middle">blocking finding</text>
  <path class="s-line-hot" d="M782,54 L808,54 Q820,54 820,66 L820,202 Q820,214 808,214 L786,214" marker-end="url(#ar11h)"/>
  <path class="s-line-hot" d="M782,134 L820,134"/>
  <circle cx="820" cy="134" r="3" fill="var(--signal)"/>
  <text class="t-hot" x="834" y="126">FeedbackLoop</text>
  <text class="t-hot" x="834" y="142">model failure</text>
  <text class="t-hot" x="834" y="158">concentrated here</text>
  <path class="s-line-soft" d="M690,188 L690,162" marker-end="url(#ar11)"/>
  <text class="t-sm" x="700" y="179">review clears</text>
  <path class="s-line-soft" d="M690,240 L690,266" marker-end="url(#ar11)"/>
  <text class="t-sm" x="700" y="259">review rejects</text>
  <text class="t-sm" x="794" y="348" text-anchor="end" style="opacity:.7">dashed: manual, via catalog.set_episode_quality</text>
  <rect x="20" y="250" width="352" height="96" rx="5" fill="var(--panel-2)" stroke="var(--rule)" stroke-width="1"/>
  <text class="t-tag" x="36" y="272">SELECTION · keep_quality → QualityFilter</text>
  <text class="t-sm" x="36" y="294">["passed"]            → 48 of 50 episodes</text>
  <text class="t-sm" x="36" y="312">["passed", "warning"] → 50 of 50 episodes</text>
  <text class="t-sm" x="36" y="332">unselected episodes stay on disk, with reasons</text>
</svg>
