<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="1246" viewBox="0 0 1060 1246" role="img" aria-label="Level 1 data flow. Eight numbered processes from download to feedback move data through four stores: the source cache, content-addressed blobs, per-version Parquet tables and the SQLite catalog. Below them a telemetry side-channel observes every process without causing work, fanning into three further stores: a Prometheus textfile for bounded-label metrics, Parquet event rows for episode-grained facts, and newline-delimited JSON spans.">
  <style>
    svg{
      --panel:#FFFFFF; --panel-2:#EEF2F4; --rule:#DCE3E7; --rule-2:#C7D2D8;
      --ink:#101C24; --accent:#0E6E8B; --accent-soft:#E2EFF4; --accent-line:#8FC2D4;
      --signal:#B45309; --signal-soft:#FBEEDF;
      --ok:#17694A; --ok-soft:#E1F0E9; --warn:#8A6100; --warn-soft:#F8EFD9;
      --err:#A32B23; --err-soft:#F8E6E4;
      --sans:"IBM Plex Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
      --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
      color:var(--ink);
    }
    @media (prefers-color-scheme:dark){
      svg{
        --panel:#121C22; --panel-2:#18242B; --rule:#22313A; --rule-2:#2E414C;
        --ink:#E3EBEF; --accent:#4FBEDC; --accent-soft:#122B34; --accent-line:#2C6D82;
        --signal:#E0913F; --signal-soft:#2E2213;
        --ok:#4FB98A; --ok-soft:#10281F; --warn:#D9A93C; --warn-soft:#2A2312;
        --err:#E5726A; --err-soft:#2E1917;
      }
    }
    .s-box{fill:var(--panel-2);stroke:var(--rule-2);stroke-width:1.5}
    .s-proc{fill:var(--accent-soft);stroke:var(--accent-line);stroke-width:1.5}
    .s-store{fill:var(--panel-2);stroke:var(--rule-2);stroke-width:1.5}
    .s-ext{fill:none;stroke:currentColor;stroke-width:1.5;stroke-dasharray:5 3;opacity:.7}
    .s-hot{fill:var(--signal-soft);stroke:var(--signal);stroke-width:1.75}
    .s-line{stroke:currentColor;stroke-width:1.4;fill:none;opacity:.75}
    .s-line-hot{stroke:var(--signal);stroke-width:2;fill:none}
    .s-line-soft{stroke:currentColor;stroke-width:1.2;fill:none;opacity:.4;stroke-dasharray:4 3}
    text{paint-order:stroke fill;stroke:var(--panel);stroke-width:3.5px;
         stroke-linejoin:round;stroke-linecap:round}
    .t-lbl{font-family:var(--sans);font-size:13.5px;font-weight:500;fill:currentColor}
    .t-sm{font-family:var(--mono);font-size:11.5px;fill:currentColor;opacity:.78}
    .t-tag{font-family:var(--mono);font-size:10.5px;fill:var(--accent);font-weight:600;letter-spacing:.06em}
    .t-hot{font-family:var(--mono);font-size:11.5px;fill:var(--signal);font-weight:500}
    .t-num{font-family:var(--mono);font-size:11.5px;font-weight:700;fill:var(--accent)}
  </style>
  <rect width="1060" height="1246" fill="var(--panel)"/>
        <defs>
          <marker id="ar4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M0,1 L9,5 L0,9 z" fill="currentColor"/>
          </marker>
          <marker id="ar4h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M0,1 L9,5 L0,9 z" fill="var(--signal)"/>
          </marker>
        </defs>
        <text class="t-tag" x="40" y="28">PROCESSES</text>
        <text class="t-tag" x="790" y="28">DATA STORES</text>
        <rect class="s-ext" x="40" y="44" width="232" height="48" rx="3"/>
        <text class="t-lbl" x="156" y="74" text-anchor="middle">HF Hub / robot fleet</text>
        <path class="s-line" d="M156,92 L156,122" marker-end="url(#ar4)"/>
        <rect class="s-proc" x="40" y="126" width="232" height="66" rx="5"/>
        <text class="t-num" x="58" y="152">1</text>
        <text class="t-lbl" x="84" y="152">Download</text>
        <text class="t-sm" x="84" y="174">resumable snapshot</text>
        <path class="s-line" d="M156,192 L156,230" marker-end="url(#ar4)"/>
        <rect class="s-proc" x="40" y="234" width="232" height="66" rx="5"/>
        <text class="t-num" x="58" y="260">2</text>
        <text class="t-lbl" x="84" y="260">Ingest</text>
        <text class="t-sm" x="84" y="282">adapter → canonical</text>
        <path class="s-line" d="M156,300 L156,338" marker-end="url(#ar4)"/>
        <rect class="s-proc" x="40" y="342" width="232" height="66" rx="5"/>
        <text class="t-num" x="58" y="368">3</text>
        <text class="t-lbl" x="84" y="368">Validate</text>
        <text class="t-sm" x="84" y="390">24 checks, one pass</text>
        <path class="s-line" d="M156,408 L156,446" marker-end="url(#ar4)"/>
        <rect class="s-proc" x="40" y="450" width="232" height="66" rx="5"/>
        <text class="t-num" x="58" y="476">4</text>
        <text class="t-lbl" x="84" y="476">Transform + gate</text>
        <text class="t-sm" x="84" y="498">filter · normalize</text>
        <path class="s-line" d="M156,516 L156,554" marker-end="url(#ar4)"/>
        <rect class="s-proc" x="40" y="558" width="232" height="66" rx="5"/>
        <text class="t-num" x="58" y="584">5</text>
        <text class="t-lbl" x="84" y="584">Re-validate</text>
        <text class="t-sm" x="84" y="606">did the transform break it?</text>
        <path class="s-line" d="M156,624 L156,662" marker-end="url(#ar4)"/>
        <rect class="s-proc" x="40" y="666" width="232" height="66" rx="5"/>
        <text class="t-num" x="58" y="692">6</text>
        <text class="t-lbl" x="84" y="692">Build</text>
        <text class="t-sm" x="84" y="714">splits + contract</text>
        <path class="s-line" d="M156,732 L156,770" marker-end="url(#ar4)"/>
        <rect class="s-proc" x="40" y="774" width="232" height="66" rx="5"/>
        <text class="t-num" x="58" y="800">7</text>
        <text class="t-lbl" x="84" y="800">Evaluate</text>
        <text class="t-sm" x="84" y="822">per-frame outcomes</text>
        <path class="s-line" d="M156,840 L156,878" marker-end="url(#ar4)"/>
        <rect class="s-hot" x="40" y="882" width="232" height="66" rx="5"/>
        <text class="t-num" x="58" y="908">8</text>
        <text class="t-lbl" x="84" y="908">Feedback</text>
        <text class="t-sm" x="84" y="930">failures → selection</text>
        <text class="t-tag" x="168" y="324">raw/v1</text>
        <text class="t-tag" x="168" y="540">clean/v1</text>
        <text class="t-tag" x="168" y="756">training/v1</text>
        <rect class="s-store" x="786" y="126" width="254" height="62" rx="2"/>
        <text class="t-num" x="802" y="152">D1</text>
        <text class="t-lbl" x="836" y="152">source_cache</text>
        <text class="t-sm" x="802" y="174">verbatim upstream · read-only</text>
        <rect class="s-store" x="786" y="280" width="254" height="62" rx="2"/>
        <text class="t-num" x="802" y="306">D2</text>
        <text class="t-lbl" x="836" y="306">blobs/</text>
        <text class="t-sm" x="802" y="328">content-addressed · shared</text>
        <rect class="s-store" x="786" y="480" width="254" height="62" rx="2"/>
        <text class="t-num" x="802" y="506">D3</text>
        <text class="t-lbl" x="836" y="506">tables/</text>
        <text class="t-sm" x="802" y="528">Parquet · per version</text>
        <rect class="s-store" x="786" y="700" width="254" height="62" rx="2"/>
        <text class="t-num" x="802" y="726">D4</text>
        <text class="t-lbl" x="836" y="726">catalog.db</text>
        <text class="t-sm" x="802" y="748">SQLite · the only mutable store</text>
        <path class="s-line" d="M272,150 L782,150" marker-end="url(#ar4)"/>
        <text class="t-sm" x="304" y="144">writes bytes</text>
        <path class="s-line" d="M786,172 L740,172 L740,246 L276,246" marker-end="url(#ar4)"/>
        <text class="t-sm" x="304" y="240">reads source</text>
        <path class="s-line" d="M272,270 L720,270 L720,311 L782,311" marker-end="url(#ar4)"/>
        <text class="t-sm" x="304" y="264">video hardlinked · 0 B</text>
        <path class="s-line" d="M272,296 L700,296 L700,494 L782,494" marker-end="url(#ar4)"/>
        <text class="t-sm" x="304" y="290">frames + episodes</text>
        <path class="s-line" d="M786,514 L680,514 L680,364 L276,364" marker-end="url(#ar4)"/>
        <text class="t-sm" x="304" y="358">stream batches, projected columns</text>
        <path class="s-line" d="M272,394 L660,394 L660,712 L782,712" marker-end="url(#ar4)"/>
        <text class="t-sm" x="304" y="388">findings + episode status</text>
        <path class="s-line" d="M272,483 L640,483 L640,528 L782,528" marker-end="url(#ar4)"/>
        <text class="t-sm" x="304" y="477">write clean/v1</text>
        <path class="s-line" d="M272,591 L620,591 L620,726 L782,726" marker-end="url(#ar4)"/>
        <text class="t-sm" x="304" y="585">re-check findings</text>
        <path class="s-line" d="M272,699 L600,699 L600,740 L782,740" marker-end="url(#ar4)"/>
        <text class="t-sm" x="304" y="693">episode index + contract</text>
        <path class="s-line" d="M786,754 L580,754 L580,807 L276,807" marker-end="url(#ar4)"/>
        <text class="t-sm" x="304" y="801">resolve version → DatasetView</text>
        <path class="s-line-hot" d="M272,915 L290,915 L290,718 L276,718" marker-end="url(#ar4h)"/>
        <text class="t-hot" x="304" y="909">episode weights → training/v2</text>
        <rect x="786" y="856" width="254" height="112" rx="4" fill="var(--panel-2)" stroke="var(--rule)" stroke-width="1"/>
        <text class="t-tag" x="804" y="882">READING THIS</text>
        <rect class="s-proc" x="804" y="896" width="22" height="14" rx="2"/>
        <text class="t-sm" x="836" y="908">process (numbered)</text>
        <rect class="s-store" x="804" y="920" width="22" height="14" rx="2"/>
        <text class="t-sm" x="836" y="932">data store (D1–D4)</text>
        <rect class="s-ext" x="804" y="944" width="22" height="14" rx="2"/>
        <text class="t-sm" x="836" y="956">external entity</text>

        <!-- ── telemetry side-channel ──────────────────────────────── -->
        <path d="M30,126 L30,1060" stroke="var(--signal)" stroke-width="1.3"
              stroke-dasharray="5 4" fill="none" opacity=".75"/>
        <path d="M30,1060 L44,1060" stroke="var(--signal)" stroke-width="1.3"
              stroke-dasharray="5 4" fill="none" marker-end="url(#ar4h)"/>
        <text class="t-hot" x="18" y="560" text-anchor="middle"
              transform="rotate(-90 18 560)">observes 1–8</text>

        <rect x="24" y="1000" width="1016" height="222" rx="5" fill="none"
              stroke="var(--signal)" stroke-width="1.5" stroke-dasharray="6 4"/>
        <text class="t-tag" x="44" y="1026" style="fill:var(--signal)">TELEMETRY — a side-channel, not a stage · causes no work · +0.8%</text>

        <rect class="s-hot" x="48" y="1042" width="250" height="66" rx="5"/>
        <text class="t-lbl" x="173" y="1070" text-anchor="middle">ObservabilitySession</text>
        <text class="t-sm" x="173" y="1092" text-anchor="middle">run_id · trace_id, minted once</text>

        <path class="s-line-hot" d="M298,1075 L318,1075 L318,1062 L336,1062" marker-end="url(#ar4h)"/>
        <path class="s-line-hot" d="M318,1075 L318,1122 L336,1122" marker-end="url(#ar4h)"/>
        <path class="s-line-hot" d="M318,1075 L318,1182 L336,1182" marker-end="url(#ar4h)"/>

        <rect class="s-store" x="340" y="1036" width="360" height="52" rx="2"/>
        <text class="t-lbl" x="356" y="1058">D5  metrics/rde.prom</text>
        <text class="t-sm" x="356" y="1078">bounded labels only · mtime = freshness</text>

        <rect class="s-store" x="340" y="1096" width="360" height="52" rx="2"/>
        <text class="t-lbl" x="356" y="1118">D6  events/*.parquet</text>
        <text class="t-sm" x="356" y="1138">episode- and run-grained facts · read by DuckDB</text>

        <rect class="s-store" x="340" y="1156" width="360" height="52" rx="2"/>
        <text class="t-lbl" x="356" y="1178">D7  spans/&lt;run_id&gt;.ndjson</text>
        <text class="t-sm" x="356" y="1198">one span per stage, never per frame</text>

        <path class="s-line-soft" d="M700,1122 L728,1122" marker-end="url(#ar4)"/>
        <text class="t-sm" x="742" y="1058">headers mirrored into</text>
        <text class="t-sm" x="742" y="1078">D4 catalog.db:</text>
        <text class="t-sm" x="742" y="1104" style="opacity:.66">pipeline_runs</text>
        <text class="t-sm" x="742" y="1122" style="opacity:.66">stage_runs</text>
        <text class="t-sm" x="742" y="1140" style="opacity:.66">qc_executions</text>
        <text class="t-sm" x="742" y="1176" style="opacity:.58">bulk rows stay in D6</text>
</svg>