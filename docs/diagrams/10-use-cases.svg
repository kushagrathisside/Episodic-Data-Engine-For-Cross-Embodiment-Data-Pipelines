<svg xmlns="http://www.w3.org/2000/svg" width="960" height="976" viewBox="0 0 960 976" role="img" aria-label="Use case diagram. A data engineer acquires, inspects, ingests, validates, transforms and traces datasets; an ML engineer builds training sets, explores, evaluates models and closes the feedback loop, which includes evaluation; a platform engineer monitors pipeline health, investigates failures, detects distribution drift and gates releases. Training is a secondary actor.">
  <style>
    svg{
      --panel:#FFFFFF; --panel-2:#EEF2F4; --rule:#DCE3E7; --rule-2:#C7D2D8;
      --ink:#101C24; --accent:#0E6E8B; --accent-soft:#E2EFF4; --accent-line:#8FC2D4;
      --signal:#B45309; --signal-soft:#FBEEDF;
      --ok:#17694A; --ok-soft:#E1F0E9; --warn:#8A6100; --warn-soft:#F8EFD9;
      --err:#A32B23; --err-soft:#F8E6E4;
      --sans:"IBM Plex Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
      --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
      color:var(--ink);
    }
    @media (prefers-color-scheme:dark){
      svg{
        --panel:#121C22; --panel-2:#18242B; --rule:#22313A; --rule-2:#2E414C;
        --ink:#E3EBEF; --accent:#4FBEDC; --accent-soft:#122B34; --accent-line:#2C6D82;
        --signal:#E0913F; --signal-soft:#2E2213;
        --ok:#4FB98A; --ok-soft:#10281F; --warn:#D9A93C; --warn-soft:#2A2312;
        --err:#E5726A; --err-soft:#2E1917;
      }
    }
    .s-box{fill:var(--panel-2);stroke:var(--rule-2);stroke-width:1.5}
    .s-proc{fill:var(--accent-soft);stroke:var(--accent-line);stroke-width:1.5}
    .s-store{fill:var(--panel-2);stroke:var(--rule-2);stroke-width:1.5}
    .s-ext{fill:none;stroke:currentColor;stroke-width:1.5;stroke-dasharray:5 3;opacity:.7}
    .s-hot{fill:var(--signal-soft);stroke:var(--signal);stroke-width:1.75}
    .s-line{stroke:currentColor;stroke-width:1.4;fill:none;opacity:.75}
    .s-line-hot{stroke:var(--signal);stroke-width:2;fill:none}
    .s-line-soft{stroke:currentColor;stroke-width:1.2;fill:none;opacity:.4;stroke-dasharray:4 3}
    text{paint-order:stroke fill;stroke:var(--panel);stroke-width:3.5px;
         stroke-linejoin:round;stroke-linecap:round}
    .t-lbl{font-family:var(--sans);font-size:13.5px;font-weight:500;fill:currentColor}
    .t-sm{font-family:var(--mono);font-size:11.5px;fill:currentColor;opacity:.78}
    .t-tag{font-family:var(--mono);font-size:10.5px;fill:var(--accent);font-weight:600;letter-spacing:.06em}
    .t-hot{font-family:var(--mono);font-size:11.5px;fill:var(--signal);font-weight:500}
    .t-num{font-family:var(--mono);font-size:11.5px;font-weight:700;fill:var(--accent)}
  </style>
  <rect width="960" height="976" fill="var(--panel)"/>
        <defs>
          <marker id="ar10" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M0,1 L9,5 L0,9 z" fill="currentColor"/>
          </marker>
        </defs>
        <rect x="204" y="30" width="580" height="870" rx="6" fill="none" stroke="var(--rule-2)" stroke-width="1.75"/>
        <text class="t-tag" x="226" y="56">EPISODIC DATA ENGINE</text>
        <circle cx="90" cy="138" r="16" fill="none" stroke="currentColor" stroke-width="1.6"/>
        <path d="M90,154 L90,198 M65,170 L115,170 M90,198 L71,230 M90,198 L109,230" fill="none" stroke="currentColor" stroke-width="1.6"/>
        <text class="t-lbl" x="90" y="254" text-anchor="middle">Data engineer</text>
        <circle cx="880" cy="300" r="16" fill="none" stroke="currentColor" stroke-width="1.6"/>
        <path d="M880,316 L880,360 M855,332 L905,332 M880,360 L861,392 M880,360 L899,392" fill="none" stroke="currentColor" stroke-width="1.6"/>
        <text class="t-lbl" x="880" y="416" text-anchor="middle">ML engineer</text>
        <rect x="822" y="560" width="118" height="76" rx="4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-dasharray="5 3"/>
        <text class="t-sm" x="881" y="588" text-anchor="middle">«system»</text>
        <text class="t-lbl" x="881" y="612" text-anchor="middle">Training</text>
        <text class="t-sm" x="881" y="660" text-anchor="middle">secondary actor</text>
        <ellipse class="s-proc" cx="336" cy="100" rx="114" ry="30"/>
        <text class="t-lbl" x="336" y="105" text-anchor="middle">Acquire dataset</text>
        <ellipse class="s-proc" cx="336" cy="180" rx="114" ry="30"/>
        <text class="t-lbl" x="336" y="185" text-anchor="middle">Inspect source</text>
        <ellipse class="s-proc" cx="336" cy="260" rx="114" ry="30"/>
        <text class="t-lbl" x="336" y="265" text-anchor="middle">Ingest to canonical</text>
        <ellipse class="s-proc" cx="336" cy="340" rx="114" ry="30"/>
        <text class="t-lbl" x="336" y="345" text-anchor="middle">Validate &amp; gate</text>
        <ellipse class="s-proc" cx="336" cy="420" rx="114" ry="30"/>
        <text class="t-lbl" x="336" y="425" text-anchor="middle">Transform</text>
        <ellipse class="s-proc" cx="336" cy="500" rx="114" ry="30"/>
        <text class="t-lbl" x="336" y="505" text-anchor="middle">Trace lineage</text>
        <ellipse class="s-box" cx="656" cy="140" rx="114" ry="30"/>
        <text class="t-lbl" x="656" y="145" text-anchor="middle">Run check suite</text>
        <ellipse class="s-box" cx="656" cy="220" rx="114" ry="30"/>
        <text class="t-lbl" x="656" y="225" text-anchor="middle">Verify alignment</text>
        <ellipse class="s-proc" cx="656" cy="300" rx="114" ry="30"/>
        <text class="t-lbl" x="656" y="305" text-anchor="middle">Build training set</text>
        <ellipse class="s-proc" cx="656" cy="380" rx="114" ry="30"/>
        <text class="t-lbl" x="656" y="385" text-anchor="middle">Explore &amp; query</text>
        <ellipse class="s-proc" cx="656" cy="460" rx="114" ry="30"/>
        <text class="t-lbl" x="656" y="465" text-anchor="middle">Evaluate model</text>
        <ellipse class="s-hot" cx="656" cy="540" rx="114" ry="30"/>
        <text class="t-lbl" x="656" y="545" text-anchor="middle">Close feedback loop</text>
        <path class="s-line" d="M122,128 L218,100"/>
        <path class="s-line" d="M122,138 L218,180"/>
        <path class="s-line" d="M122,148 L218,260"/>
        <path class="s-line" d="M122,158 L218,340"/>
        <path class="s-line" d="M122,168 L218,420"/>
        <path class="s-line" d="M122,178 L218,500"/>
        <path class="s-line" d="M850,326 L772,300"/>
        <path class="s-line" d="M850,336 L772,380"/>
        <path class="s-line" d="M850,346 L772,460"/>
        <path class="s-line" d="M850,356 L772,540"/>
        <path class="s-line" d="M768,474 L822,578"/>
        <path class="s-line" d="M770,548 L822,600"/>
        <path class="s-line-soft" d="M448,330 L536,152" marker-end="url(#ar10)"/>
        <text class="t-sm" x="496" y="222" text-anchor="middle" transform="rotate(-30 496 222)">«include»</text>
        <path class="s-line-soft" d="M450,350 L538,232" marker-end="url(#ar10)"/>
        <text class="t-sm" x="496" y="304" text-anchor="middle" transform="rotate(-22 496 304)">«include»</text>
        <path class="s-line-soft" d="M656,508 L656,494" marker-end="url(#ar10)"/>
        <text class="t-sm" x="668" y="506">«include»</text>
        <text class="t-sm" x="226" y="934">Solid lines are actor associations; dashed are «include» / «extend» relations between use cases.</text>
  
        <!-- ── observability use cases ─────────────────────────────── -->
        <path d="M220,632 L768,632" stroke="var(--signal)" stroke-width="1.2"
              stroke-dasharray="6 4" fill="none" opacity=".8"/>
        <text class="t-tag" x="226" y="656" style="fill:var(--signal)">OBSERVABILITY PLANE</text>

        <circle cx="90" cy="746" r="16" fill="none" stroke="currentColor" stroke-width="1.6"/>
        <path d="M90,762 L90,806 M65,778 L115,778 M90,806 L71,838 M90,806 L109,838"
              fill="none" stroke="currentColor" stroke-width="1.6"/>
        <text class="t-lbl" x="90" y="862" text-anchor="middle">Platform engineer</text>

        <ellipse class="s-hot" cx="336" cy="690" rx="114" ry="30"/>
        <text class="t-lbl" x="336" y="695" text-anchor="middle">Monitor health</text>
        <ellipse class="s-proc" cx="336" cy="800" rx="114" ry="30"/>
        <text class="t-lbl" x="336" y="805" text-anchor="middle">Investigate a failure</text>

        <ellipse class="s-hot" cx="656" cy="730" rx="114" ry="30"/>
        <text class="t-lbl" x="656" y="735" text-anchor="middle">Gate a release</text>
        <ellipse class="s-proc" cx="656" cy="830" rx="114" ry="30"/>
        <text class="t-lbl" x="656" y="835" text-anchor="middle">Detect drift</text>

        <!-- associations: the line to Gate passes through the gap, crossing nothing -->
        <path class="s-line" d="M122,738 L222,690"/>
        <path class="s-line" d="M122,760 L222,800"/>
        <path class="s-line" d="M122,746 L542,732"/>

        <path class="s-line-soft" d="M336,770 L336,724" marker-end="url(#ar10)"/>
        <text class="t-sm" x="398" y="752">«extend»</text>
        <path class="s-line-soft" d="M656,760 L656,798" marker-end="url(#ar10)"/>
        <text class="t-sm" x="718" y="784">«include»</text>
</svg>