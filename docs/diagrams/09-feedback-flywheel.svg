<svg xmlns="http://www.w3.org/2000/svg" width="1012" height="236" viewBox="0 0 1012 236" role="img" aria-label="The data flywheel: inference produces per-frame outcomes, failure detection uses relative thresholds, episodes are nominated and quarantined rather than deleted, and a new training version is built with the flagged episodes upweighted.">
  <style>
    svg{
      --panel:#FFFFFF; --panel-2:#EEF2F4; --rule:#DCE3E7; --rule-2:#C7D2D8;
      --ink:#101C24; --accent:#0E6E8B; --accent-soft:#E2EFF4; --accent-line:#8FC2D4;
      --signal:#B45309; --signal-soft:#FBEEDF;
      --ok:#17694A; --ok-soft:#E1F0E9; --warn:#8A6100; --warn-soft:#F8EFD9;
      --err:#A32B23; --err-soft:#F8E6E4;
      --sans:"IBM Plex Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
      --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
      color:var(--ink);
    }
    @media (prefers-color-scheme:dark){
      svg{
        --panel:#121C22; --panel-2:#18242B; --rule:#22313A; --rule-2:#2E414C;
        --ink:#E3EBEF; --accent:#4FBEDC; --accent-soft:#122B34; --accent-line:#2C6D82;
        --signal:#E0913F; --signal-soft:#2E2213;
        --ok:#4FB98A; --ok-soft:#10281F; --warn:#D9A93C; --warn-soft:#2A2312;
        --err:#E5726A; --err-soft:#2E1917;
      }
    }
    .s-box{fill:var(--panel-2);stroke:var(--rule-2);stroke-width:1.5}
    .s-proc{fill:var(--accent-soft);stroke:var(--accent-line);stroke-width:1.5}
    .s-store{fill:var(--panel-2);stroke:var(--rule-2);stroke-width:1.5}
    .s-ext{fill:none;stroke:currentColor;stroke-width:1.5;stroke-dasharray:5 3;opacity:.7}
    .s-hot{fill:var(--signal-soft);stroke:var(--signal);stroke-width:1.75}
    .s-line{stroke:currentColor;stroke-width:1.4;fill:none;opacity:.75}
    .s-line-hot{stroke:var(--signal);stroke-width:2;fill:none}
    .s-line-soft{stroke:currentColor;stroke-width:1.2;fill:none;opacity:.4;stroke-dasharray:4 3}
    text{paint-order:stroke fill;stroke:var(--panel);stroke-width:3.5px;
         stroke-linejoin:round;stroke-linecap:round}
    .t-lbl{font-family:var(--sans);font-size:13.5px;font-weight:500;fill:currentColor}
    .t-sm{font-family:var(--mono);font-size:11.5px;fill:currentColor;opacity:.78}
    .t-tag{font-family:var(--mono);font-size:10.5px;fill:var(--accent);font-weight:600;letter-spacing:.06em}
    .t-hot{font-family:var(--mono);font-size:11.5px;fill:var(--signal);font-weight:500}
    .t-num{font-family:var(--mono);font-size:11.5px;font-weight:700;fill:var(--accent)}
  </style>
  <rect width="1012" height="236" fill="var(--panel)"/>
        <defs>
          <marker id="ar9" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M0,1 L9,5 L0,9 z" fill="var(--signal)"/>
          </marker>
        </defs>
        <g>
          <rect class="s-proc" x="20" y="28" width="172" height="64" rx="4"/>
          <text class="t-lbl" x="106" y="52" text-anchor="middle">Inference</text>
          <text class="t-sm" x="106" y="70" text-anchor="middle">1,908 held-out frames</text>
          <text class="t-sm" x="106" y="85" text-anchor="middle">per-frame outcomes</text>

          <rect class="s-proc" x="220" y="28" width="172" height="64" rx="4"/>
          <text class="t-lbl" x="306" y="52" text-anchor="middle">Failure records</text>
          <text class="t-sm" x="306" y="70" text-anchor="middle">279 frames</text>
          <text class="t-sm" x="306" y="85" text-anchor="middle">p90 error · p10 conf</text>

          <rect class="s-proc" x="420" y="28" width="172" height="64" rx="4"/>
          <text class="t-lbl" x="506" y="52" text-anchor="middle">Episode review</text>
          <text class="t-sm" x="506" y="70" text-anchor="middle">5 nominated</text>
          <text class="t-sm" x="506" y="85" text-anchor="middle">ranked by priority</text>

          <rect class="s-proc" x="620" y="28" width="172" height="64" rx="4"/>
          <text class="t-lbl" x="706" y="52" text-anchor="middle">Quarantine</text>
          <text class="t-sm" x="706" y="70" text-anchor="middle">marked, not deleted</text>
          <text class="t-sm" x="706" y="85" text-anchor="middle">48 episodes remain</text>

          <rect class="s-hot" x="820" y="28" width="172" height="64" rx="4"/>
          <text class="t-lbl" x="906" y="52" text-anchor="middle">training/v2</text>
          <text class="t-sm" x="906" y="70" text-anchor="middle">weights {3,14,27,29,42}</text>
          <text class="t-sm" x="906" y="85" text-anchor="middle">upweighted ×2</text>
        </g>

        <path class="s-line-hot" d="M196,60 L216,60" marker-end="url(#ar9)"/>
        <path class="s-line-hot" d="M396,60 L416,60" marker-end="url(#ar9)"/>
        <path class="s-line-hot" d="M596,60 L616,60" marker-end="url(#ar9)"/>
        <path class="s-line-hot" d="M796,60 L816,60" marker-end="url(#ar9)"/>

        <path class="s-line-hot" d="M906,96 L906,138 Q906,156 888,156 L124,156 Q106,156 106,138 L106,96" marker-end="url(#ar9)"/>
        <text class="t-hot" x="506" y="148" text-anchor="middle">next training round reads the new version — the loop is in the lineage</text>

        <rect x="20" y="176" width="972" height="34" rx="4" fill="var(--panel-2)" stroke="var(--rule)" stroke-width="1"/>
        <text class="t-sm" x="36" y="197">Thresholds are percentiles of <tspan font-style="italic">this run</tspan>, not absolutes: what counts as a large error depends on units, normalization and model.</text>
      </svg>
