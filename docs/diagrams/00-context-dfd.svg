<svg xmlns="http://www.w3.org/2000/svg" width="924" height="346" viewBox="0 0 924 346" role="img" aria-label="Context diagram: dataset sources and a data engineer feed the Episodic Data Engine, which serves dataset versions to a training layer and reports to exploration; the training layer returns evaluation failures.">
  <style>
    svg{
      --panel:#FFFFFF; --panel-2:#EEF2F4; --rule:#DCE3E7; --rule-2:#C7D2D8;
      --ink:#101C24; --accent:#0E6E8B; --accent-soft:#E2EFF4; --accent-line:#8FC2D4;
      --signal:#B45309; --signal-soft:#FBEEDF;
      --ok:#17694A; --ok-soft:#E1F0E9; --warn:#8A6100; --warn-soft:#F8EFD9;
      --err:#A32B23; --err-soft:#F8E6E4;
      --sans:"IBM Plex Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
      --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
      color:var(--ink);
    }
    @media (prefers-color-scheme:dark){
      svg{
        --panel:#121C22; --panel-2:#18242B; --rule:#22313A; --rule-2:#2E414C;
        --ink:#E3EBEF; --accent:#4FBEDC; --accent-soft:#122B34; --accent-line:#2C6D82;
        --signal:#E0913F; --signal-soft:#2E2213;
        --ok:#4FB98A; --ok-soft:#10281F; --warn:#D9A93C; --warn-soft:#2A2312;
        --err:#E5726A; --err-soft:#2E1917;
      }
    }
    .s-box{fill:var(--panel-2);stroke:var(--rule-2);stroke-width:1.5}
    .s-proc{fill:var(--accent-soft);stroke:var(--accent-line);stroke-width:1.5}
    .s-store{fill:var(--panel-2);stroke:var(--rule-2);stroke-width:1.5}
    .s-ext{fill:none;stroke:currentColor;stroke-width:1.5;stroke-dasharray:5 3;opacity:.7}
    .s-hot{fill:var(--signal-soft);stroke:var(--signal);stroke-width:1.75}
    .s-line{stroke:currentColor;stroke-width:1.4;fill:none;opacity:.75}
    .s-line-hot{stroke:var(--signal);stroke-width:2;fill:none}
    .s-line-soft{stroke:currentColor;stroke-width:1.2;fill:none;opacity:.4;stroke-dasharray:4 3}
    text{paint-order:stroke fill;stroke:var(--panel);stroke-width:3.5px;
         stroke-linejoin:round;stroke-linecap:round}
    .t-lbl{font-family:var(--sans);font-size:13.5px;font-weight:500;fill:currentColor}
    .t-sm{font-family:var(--mono);font-size:11.5px;fill:currentColor;opacity:.78}
    .t-tag{font-family:var(--mono);font-size:10.5px;fill:var(--accent);font-weight:600;letter-spacing:.06em}
    .t-hot{font-family:var(--mono);font-size:11.5px;fill:var(--signal);font-weight:500}
    .t-num{font-family:var(--mono);font-size:11.5px;font-weight:700;fill:var(--accent)}
  </style>
  <rect width="924" height="346" fill="var(--panel)"/>
        <defs>
          <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M0,1 L9,5 L0,9 z" fill="currentColor"/>
          </marker>
          <marker id="arh" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M0,1 L9,5 L0,9 z" fill="var(--signal)"/>
          </marker>
        </defs>

        <!-- external entities -->
        <rect class="s-ext" x="24" y="34" width="176" height="58" rx="3"/>
        <text class="t-lbl" x="112" y="58" text-anchor="middle">Dataset source</text>
        <text class="t-sm" x="112" y="76" text-anchor="middle">HF Hub · robot fleet</text>

        <rect class="s-ext" x="24" y="230" width="176" height="58" rx="3"/>
        <text class="t-lbl" x="112" y="254" text-anchor="middle">Data engineer</text>
        <text class="t-sm" x="112" y="272" text-anchor="middle">CLI · config</text>

        <!-- the engine -->
        <rect class="s-proc" x="330" y="112" width="240" height="98" rx="6"/>
        <text class="t-num" x="350" y="136">0</text>
        <text class="t-lbl" x="450" y="152" text-anchor="middle" font-size="15">Episodic Data Engine</text>
        <text class="t-sm" x="450" y="172" text-anchor="middle">ingest · validate · version</text>
        <text class="t-sm" x="450" y="188" text-anchor="middle">transform · build · serve</text>

        <!-- consumers -->
        <rect class="s-ext" x="700" y="34" width="176" height="58" rx="3"/>
        <text class="t-lbl" x="788" y="58" text-anchor="middle">Training layer</text>
        <text class="t-sm" x="788" y="76" text-anchor="middle">any model</text>

        <rect class="s-ext" x="700" y="230" width="176" height="58" rx="3"/>
        <text class="t-lbl" x="788" y="254" text-anchor="middle">Exploration</text>
        <text class="t-sm" x="788" y="272" text-anchor="middle">CLI · reports</text>

        <!-- flows in -->
        <path class="s-line" d="M200,63 L266,63 Q286,63 286,86 L286,140 L326,140" marker-end="url(#ar)"/>
        <text class="t-sm" x="206" y="53">episodes · video · metadata</text>

        <path class="s-line" d="M200,259 L266,259 Q286,259 286,236 L286,182 L326,182" marker-end="url(#ar)"/>
        <text class="t-sm" x="206" y="278">config · gate policy · queries</text>

        <!-- flows out -->
        <path class="s-line" d="M574,140 L614,140 Q634,140 634,117 L634,63 L696,63" marker-end="url(#ar)"/>
        <text class="t-sm" x="600" y="53" text-anchor="middle">dataset version</text>
        <text class="t-sm" x="600" y="98" text-anchor="middle">+ training contract</text>

        <path class="s-line" d="M574,182 L614,182 Q634,182 634,205 L634,259 L696,259" marker-end="url(#ar)"/>
        <text class="t-sm" x="586" y="284" text-anchor="middle">QC findings · lineage · stats</text>

        <!-- feedback -->
        <path class="s-line-hot" d="M876,63 L888,63 Q900,63 900,78 L900,310 Q900,324 886,324 L360,324 Q346,324 346,310 L346,216" marker-end="url(#arh)"/>
        <text class="t-hot" x="620" y="316" text-anchor="middle">evaluation failures · low-confidence frames</text>
      </svg>
